[project]
name = "jev-agent-kit"
version = "0.4.0"
description = "Maintainer and evaluation CLI for the Jev Agent Kit Claude Code plugin (standard library only)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
jev = "jevkit.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jevkit"
module-root = ""
